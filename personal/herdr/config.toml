onboarding = false
# herdr config — managed in dotfiles (personal/herdr/config.toml, symlinked
# into ~/.config/herdr/). Runtime state (sockets, logs, sessions/) stays in
# ~/.config/herdr/ itself and is never managed here.

# Worker state signals route through the pi-subagents extension's Inbox /
# ping_user system. herdr must never notify audibly or visually: no popups
# (in-app, terminal, or OS notifications are all delivery modes of this key),
# no sounds.
# Non-active Space names + Agents-row workspace names render at text brightness:
# subtext0 is reassigned to catppuccin `text` (workspace-name tokens read subtext0).
[theme.custom]
subtext0 = "#cdd6f4"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

[ui]
status_indicators = "symbols"
# Long workspace/tab labels (subagent titles) need more room than the default 36-column cap.
sidebar_max_width = 52

# Sidebar rows: subagent spaces decompose into $layer (source · agent, bold) and
# $lineage1/$lineage2 (stream + ancestors, dim, wrapped at sidebar_max_width - 4);
# the long composite label is hidden for our workspaces only (contains " · ").
# Agents rows: workspace (the pane's space) headline, state text, then the subagent's
# `(type) name` ($identity, pi-subagents panes only) and its lineage as `> ` lines, nearest
# ancestor first, ending at the root session `root:stream`.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "state_icon", dim = false }, "workspace"],
  ["state_text"],
  [{ token = "$identity" }],
  [{ token = "$lineage1", dim = true }],
  [{ token = "$lineage2", dim = true }],
  [{ token = "$lineage3", dim = true }],
  [{ token = "$lineage4", dim = true }],
  [{ token = "$lineage5", dim = true }],
  [{ token = "$lineage6", dim = true }],
  [{ token = "$lineage7", dim = true }],
  [{ token = "$lineage8", dim = true }],
  [{ token = "$lineage9", dim = true }],
  [{ token = "$lineage10", dim = true }],
  [{ token = "$lineage11", dim = true }],
  [{ token = "$lineage12", dim = true }],
  [{ token = "$lineage13", dim = true }],
  [{ token = "$lineage14", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon",
   { token = "workspace", rules = [{ contains = " · ", hide = true }] },
   { token = "$origin" }],
  [{ token = "$name", bold = true }],
  [{ token = "$gap" }],
]
